<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 轨迹回放</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2639; --line: #2a3550;
    --text: #dbe4f5; --dim: #8291ad; --ok: #3fd08a; --bad: #ff6b6b;
    --accent: #5ea0ff; --warn: #ffb86b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 "Microsoft YaHei", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 22px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; }
  .chip { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--dim); }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.pass b { color: var(--ok); } .chip.fail b { color: var(--bad); }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  #drop { border: 2px dashed var(--line); border-radius: 14px; padding: 60px 20px; text-align: center; color: var(--dim); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  .turn { margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .turn-head { padding: 8px 14px; background: var(--panel2); font-weight: 600; font-size: 13px; color: var(--dim); display: flex; gap: 12px; }
  .badge { font-size: 11px; border-radius: 6px; padding: 1px 8px; }
  .b-ok { background: rgba(63,208,138,.15); color: var(--ok); }
  .b-bad { background: rgba(255,107,107,.15); color: var(--bad); }
  .b-compact { background: rgba(255,184,107,.15); color: var(--warn); }
  .b-finish { background: rgba(94,160,255,.15); color: var(--accent); }
  .body { padding: 10px 14px; }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 9px; background: var(--panel2); }
  .msg.assistant { border-left: 3px solid var(--accent); white-space: pre-wrap; }
  .args, .output { margin-top: 6px; background: #101625; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-all; color: #b9c6df; }
  .output { max-height: 300px; overflow: auto; }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .compact-box { border-left: 3px solid var(--warn); }
  .sys { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Agent 轨迹回放</h1>
  <span id="meta" class="sys">拖入或点击选择 trajectory.jsonl</span>
</header>
<main>
  <div id="drop">把 harness 运行目录里的 <b>trajectory.jsonl</b> 拖到这里，或点击选择文件<br><span class="sys">支持同时查看 summary.json 中的判分结果（把 summary.json 也拖进来）</span>
    <input type="file" id="file" accept=".jsonl,.json,.txt" multiple hidden>
  </div>
  <div id="app"></div>
</main>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const app = document.getElementById('app');
const meta = document.getElementById('meta');
let summary = null;

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  let pending = files.length;
  for (const f of files) {
    const r = new FileReader();
    r.onload = () => {
      const text = String(r.result);
      if (f.name.endsWith('.jsonl')) { render(parseJsonl(text)); }
      else if (f.name === 'summary.json') { try { summary = JSON.parse(text); } catch {} }
      if (--pending === 0) { drop.style.display = 'none'; }
    };
    r.readAsText(f);
  }
}

function parseJsonl(text) {
  return text.split('\n').filter(l => l.trim()).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
}

function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function render(events) {
  const runStart = events.find(e => e.type === 'run_start');
  const final = events.find(e => e.type === 'final');
  const compacts = events.filter(e => e.type === 'compact');
  const tools = events.filter(e => e.type === 'tool_exec');
  const errs = tools.filter(e => !e.data.ok).length;
  const graded = events.find(e => e.type === 'graded');
  const pass = graded ? graded.data.pass : null;

  meta.innerHTML = runStart
    ? `任务 <b>${esc(runStart.data.task_id)}·${esc(runStart.data.name)}</b>（${esc(runStart.data.category)}） 模型 ${esc(runStart.data.model)}　` +
      (final ? `回合 ${final.data.turns}　token ${final.data.usage.prompt_tokens}+${final.data.usage.completion_tokens}　状态 ${esc(final.data.status)}　` : '') +
      `工具调用 ${tools.length}（失败 ${errs}）　压缩 ${compacts.length} 次` +
      (pass !== null ? `　<a class="chip ${pass ? 'pass' : 'fail'}">判分 <b>${pass ? '通过' : '未通过'}</b></a>` : '')
    : '未识别到 run_start 事件';

  let html = '';
  if (runStart) {
    html += `<div class="turn"><div class="turn-head">任务说明</div><div class="body"><div class="msg assistant">${esc(runStart.data.prompt)}</div></div></div>`;
  }
  let turn = 0;
  let openTurn = null;
  const flush = () => { if (openTurn) { html += openTurn.close(); openTurn = null; } };
  for (const ev of events) {
    if (ev.type === 'run_start' || ev.type === 'graded') continue;
    if (ev.type === 'message' && ev.data.role === 'assistant') {
      flush();
      turn++;
      openTurn = card(turn, ev);
      continue;
    }
    if (!openTurn) { turn++; openTurn = card(turn, null); }
    if (ev.type === 'tool_exec') {
      openTurn.parts.push(toolCard(ev.data));
    } else if (ev.type === 'compact') {
      openTurn.parts.push(`<div class="msg compact-box"><span class="badge b-compact">上下文压缩</span> ${ev.data.before} → ${ev.data.after} tok（${esc(ev.data.method)}，丢弃 ${ev.data.dropped_groups} 个回合）</div>`);
    } else if (ev.type === 'final') {
      openTurn.parts.push(`<div class="msg assistant"><span class="badge b-finish">最终答案</span>\n${esc(ev.data.answer)}</div>`);
    } else if (ev.type === 'resume') {
      flush();
      html += `<div class="turn"><div class="turn-head">↺ 从 checkpoint 续跑（上次中断于回合 ${ev.data.turn}）</div></div>`;
    }
  }
  flush();
  app.innerHTML = html;
}

function card(turn, ev) {
  const d = ev ? ev.data : {};
  const cardObj = {
    parts: [],
    close() {
      let head = `<div class="turn"><div class="turn-head">回合 ${turn}`;
      if (ev) {
        const calls = (d.tool_calls || []).map(t => esc(t.name)).join(', ') || '纯文本回复';
        head += `　→ ${calls}</div>`;
      } else {
        head += '</div>';
      }
      let inner = '';
      if (ev && d.content) inner += `<div class="msg assistant">${esc(d.content)}</div>`;
      if (ev) for (const tc of d.tool_calls || []) {
        inner += `<div class="msg"><b>${esc(tc.name)}</b><details open><summary>调用参数</summary><div class="args">${esc(prettyJson(tc.arguments))}</div></details></div>`;
      }
      return head + `<div class="body">${inner}${this.parts.join('')}</div></div>`;
    },
  };
  return cardObj;
}

function toolCard(d) {
  return `<details ${d.ok ? '' : 'open'}><summary><span class="badge ${d.ok ? 'b-ok' : 'b-bad'}">${d.ok ? '成功' : '失败'}</span> 执行结果（${(d.ms / 1000).toFixed(1)}s）</summary><div class="output">${esc(d.output)}</div></details>`;
}

function prettyJson(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } }
</script>
</body>
</html>
